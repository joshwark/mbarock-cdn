<script>
/* MBA Rock - Member gate v1 2026-05-14 */
(function(){
  try {
    var hasAuth = localStorage.getItem('mr-member-id') || localStorage.getItem('mr_member_id') || localStorage.getItem('memberId') || new URLSearchParams(location.search).get('m') || (document.referrer && /mbarock\.com|panda-reindeer/i.test(document.referrer));
    if (hasAuth) return;
    var css = '.mr-gate{position:fixed;inset:0;z-index:2147483647;background:linear-gradient(180deg,#0B1F3A 0%,#152D52 100%);color:#FDFAF1;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;padding:40px;text-align:center}.mr-gate-inner{max-width:580px}.mr-gate .pill{display:inline-block;background:rgba(242,107,31,.18);color:#F26B1F;padding:8px 16px;border-radius:999px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:24px;border:1px solid rgba(242,107,31,.35)}.mr-gate h1{font-family:Fraunces,Georgia,serif;font-size:clamp(32px,5vw,52px);color:#FDFAF1;margin:0 0 20px;line-height:1.12;font-weight:800;letter-spacing:-.02em}.mr-gate p{font-size:18px;line-height:1.6;color:rgba(253,250,241,.86);margin:0 0 32px}.mr-gate .price-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}.mr-gate .price-row .anchor{font-family:Fraunces;color:rgba(253,250,241,.5);text-decoration:line-through;font-size:18px;font-style:italic}.mr-gate .price-row .now{font-family:Fraunces;font-size:42px;font-weight:800;color:#FDFAF1;line-height:1;letter-spacing:-.02em}.mr-gate .price-row .code{font-family:Inter;font-size:12px;font-weight:700;letter-spacing:.16em;color:#F26B1F;text-transform:uppercase}.mr-gate .cta{display:inline-block;padding:18px 44px;background:#F26B1F;color:#fff;border-radius:999px;font-weight:700;font-size:16px;letter-spacing:.04em;text-decoration:none;min-height:48px;line-height:1.2;box-shadow:0 12px 28px rgba(242,107,31,.32)}.mr-gate .ghost{display:inline-block;padding:16px 32px;color:#FDFAF1;border:2px solid rgba(253,250,241,.4);border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;margin-top:12px;margin-left:8px}';
    var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
    function build(){
      var g = document.createElement('div');
      g.className = 'mr-gate';
      g.setAttribute('role','dialog');
      g.setAttribute('aria-modal','true');
      var html = '';
      html += '<div class="mr-gate-inner">';
      html += '<span class="pill">Members only - MBA Rock</span>';
      html += '<h1>Flashcards are part of MBA Rock.</h1>';
      html += '<p>Every key concept from the 74 lessons, in flashcard form. Spaced-repetition-ready review for the course curriculum.</p>';
      html += '<div class="price-row"><span class="anchor">$999.99</span><span class="now">$499</span><span class="code">with code FOUNDERS</span></div>';
      html += '<a href="https://www.mbarock.com/mba-rock" class="cta">Unlock MBA Rock \u2192</a>';
      html += '<a href="https://www.mbarock.com" class="ghost">See what\u2019s inside</a>';
      html += '</div>';
      g.innerHTML = html;
      document.body.appendChild(g);
      document.body.style.overflow = 'hidden';
    }
    if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
  } catch(e) { console.error('[MR gate] error', e); }
})();
</script>

<meta charset="UTF-8" />

<style>
:root{
  --navy:#0B1F3A; --ink:#0E1116; --orange:#F26B1F; --orange-soft:#FBE2D0;
  --cream:#FAF8F5; --paper:#FFFFFF; --rule:#E5E0D6; --muted:#8A8A8A; --green:#1D8444;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;line-height:1.55;min-height:100vh;}
h1,h2,h3,h4{font-family:'Fraunces',serif;letter-spacing:-0.018em;color:var(--navy);margin:0;font-weight:600;}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent,var(--orange));font-weight:700;}
a{color:inherit;}

.app{max-width:820px;margin:0 auto;padding:36px 28px 60px;min-height:100vh;display:flex;flex-direction:column;}
.crumb{font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:18px;}
.crumb a{text-decoration:none;border-bottom:1px dotted var(--muted);}
.crumb a:hover{color:var(--accent,var(--orange));}

.head-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.head-row h1{font-size:34px;line-height:1.1;letter-spacing:-0.02em;}
.head-row .meta{font-family:'Fraunces',serif;color:#666;font-size:14px;}
.head-row .meta b{color:var(--accent,var(--orange));font-weight:700;font-variant-numeric:tabular-nums;}

.progress-bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:32px;}
.progress-bar i{display:block;height:100%;background:var(--accent,var(--orange));width:0;transition:width .3s ease;}

/* Card stage */
.stage{
  flex:1;display:flex;align-items:center;justify-content:center;perspective:1200px;min-height:380px;
}
.card{
  position:relative;width:100%;max-width:660px;aspect-ratio:5/3;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.6,.2,1.0);
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:48px 56px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;
  box-shadow:0 24px 60px -22px rgba(11,31,58,0.22);overflow:hidden;
}
.face::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--accent,var(--orange));}
.face.back{transform:rotateY(180deg);background:var(--cream);}
.face .lbl{position:absolute;top:18px;left:24px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent,var(--orange));font-weight:700;}
.face .n{position:absolute;top:18px;right:24px;font-family:'Fraunces',serif;font-size:16px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
.face .content{font-family:'Fraunces',serif;font-size:24px;line-height:1.35;color:var(--navy);font-weight:500;letter-spacing:-0.01em;max-width:560px;}
.face.back .content{font-family:'Fraunces',serif;font-size:22px;line-height:1.45;color:#222;font-weight:400;}
.face .flip-hint{position:absolute;bottom:18px;left:0;right:0;font-size:10.5px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;font-weight:700;}

/* KaTeX size inside the card */
.face .katex{font-size:1.1em;}
.face.back .katex{font-size:1em;}

/* Controls */
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:32px;gap:14px;flex-wrap:wrap;}
.controls .nav{display:flex;gap:10px;}
.controls button{
  font-family:'Inter',sans-serif;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  padding:12px 22px;border-radius:30px;border:0;cursor:pointer;transition:all .15s;background:var(--paper);color:var(--ink);border:1px solid var(--rule);
}
.controls button:hover:not(:disabled){border-color:var(--navy);}
.controls button:disabled{opacity:.4;cursor:not-allowed;}
.controls .flip{background:var(--navy);color:#fff;border-color:var(--navy);}
.controls .flip:hover{background:var(--accent,var(--orange));border-color:var(--accent,var(--orange));}

.kb-hint{text-align:center;margin-top:18px;font-size:11px;color:var(--muted);letter-spacing:.04em;font-style:italic;font-family:'Fraunces',serif;}
.kb-hint kbd{
  display:inline-block;padding:2px 7px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;
  font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:10.5px;color:var(--navy);font-weight:600;letter-spacing:0;
}

/* Loading / error / empty */
.state{
  background:var(--paper);border:1px dashed var(--rule);border-radius:14px;padding:48px 30px;text-align:center;
  font-family:'Fraunces',serif;font-style:italic;color:#666;font-size:16px;line-height:1.5;
}
.state b{font-style:normal;color:var(--navy);}

/* Done overlay */
.done-card{
  background:var(--navy);color:#fff;border-radius:18px;padding:48px 40px;text-align:center;display:flex;flex-direction:column;gap:18px;
  position:relative;overflow:hidden;max-width:660px;margin:0 auto;
}
.done-card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--accent,var(--orange));}
.done-card .eyebrow{color:var(--accent,var(--orange));}
.done-card h2{color:#fff;font-size:32px;margin:6px 0 4px;}
.done-card p{font-family:'Fraunces',serif;font-style:italic;color:rgba(255,255,255,0.8);font-size:17px;line-height:1.5;margin:0 0 18px;}
.done-card .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.done-card .btn-row a, .done-card .btn-row button{
  font-family:'Inter',sans-serif;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  padding:14px 22px;border-radius:30px;text-decoration:none;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:8px;
}
.done-card .btn-restart{background:var(--accent,var(--orange));color:#fff;}
.done-card .btn-restart:hover{background:#fff;color:var(--navy);}
.done-card .btn-secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3);}
.done-card .btn-secondary:hover{border-color:var(--accent,var(--orange));color:var(--accent,var(--orange));}

@media(max-width:680px){
  .app{padding:24px 18px 40px;}
  .head-row h1{font-size:26px;}
  .face{padding:32px 28px;}
  .face .content{font-size:19px;}
  .face.back .content{font-size:17px;}
  .controls button{padding:11px 16px;font-size:10.5px;letter-spacing:.12em;}
  .kb-hint{display:none;}
}
</style>
</head>

<script>
/* MR auth-gated render v2 — strips member content from DOM for unauth visitors */
(function(){
  try {
    var hasAuth = !!(
      localStorage.getItem('mba-rock-member-id') ||
      localStorage.getItem('mr-member-id') ||
      localStorage.getItem('mr_member_id') ||
      localStorage.getItem('memberId') ||
      new URLSearchParams(location.search).get('m') ||
      (document.referrer && /mbarock\.com|panda-reindeer/i.test(document.referrer))
    );
    var m = document.getElementById('mr-protected');
    if (hasAuth) {
      if (m) m.hidden = false;
    } else {
      if (m && m.parentNode) m.parentNode.removeChild(m);
    }
  } catch (e) { console.error('[MR auth-render]', e); }
})();
</script>


<script>
console.log('[Flashcards] v1 loaded');

const MODULES = {
  M1:{accent:'#0B2545', title:'Finance Fundamentals',           csv:'finance.csv'},
  M2:{accent:'#1A3A6B', title:'Strategy & Competitive Advantage', csv:'strategy.csv'},
  M3:{accent:'#8B1A1A', title:'People & Leadership',             csv:'leadership.csv'},
  M4:{accent:'#1A5C2A', title:'Unit Economics & Growth Metrics', csv:'business.csv'},
  M5:{accent:'#4A1A6B', title:'Operations & Technology',         csv:'operations.csv'},
  M6:{accent:'#6B3A0B', title:'Growth & Capital',                csv:'business.csv'},
  M7:{accent:'#F26B1F', title:'Marketing & Brand',               csv:'marketing.csv'},
  M8:{accent:'#475569', title:'Operations & Execution',          csv:'operations.csv'},
  M9:{accent:'#3B4F8C', title:'Analytics & Decision Making',     csv:'business.csv'},
  M10:{accent:'#A88735', title:'Innovation & Future',            csv:'strategy.csv'},
};

const CSV_BASE = 'https://learn.mbarock.com/flashcards/';

let state = { cards: [], idx: 0, flipped: false, done: false, moduleId: 'M1' };

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

// Parse CSV — handles quoted fields with embedded commas + escaped quotes
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0; i<text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if (field || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length >= 2 && (r[0].trim() || r[1].trim()));
}

async function loadDeck(moduleId){
  const m = MODULES[moduleId];
  if (!m) return null;
  try {
    const r = await fetch(CSV_BASE + m.csv);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const text = await r.text();
    const rows = parseCSV(text);
    return rows.map(([q,a]) => ({ q: (q||'').trim(), a: (a||'').trim() })).filter(c => c.q && c.a);
  } catch(e){
    console.warn('[Flashcards] CSV load failed', e);
    return null;
  }
}

function renderLoading(moduleId){
  const m = MODULES[moduleId];
  const root = document.getElementById('content');
  let html = '';
  html += `<div class="crumb"><a href="/dashboard/">Dashboard</a> · <a href="/module/?id=${moduleId}">${m?esc(m.title):moduleId}</a> · <span>Flashcards</span></div>`;
  html += '<div class="state"><b>Loading flashcards…</b><br>Pulling cards from the CDN.</div>';
  root.innerHTML = html;
}

function renderError(moduleId, err){
  const m = MODULES[moduleId];
  const root = document.getElementById('content');
  let html = '';
  html += `<div class="crumb"><a href="/dashboard/">Dashboard</a> · <a href="/module/?id=${moduleId}">${m?esc(m.title):moduleId}</a> · <span>Flashcards</span></div>`;
  html += `<div class="state"><b>Flashcards couldn't load.</b><br>${esc(err)} — please refresh, or open <a href="/module/?id=${moduleId}" style="color:var(--orange);">the module page</a> while we investigate.</div>`;
  root.innerHTML = html;
}

function renderDone(){
  const m = MODULES[state.moduleId];
  const root = document.getElementById('content');
  let html = '';
  html += `<div class="crumb"><a href="/dashboard/">Dashboard</a> · <a href="/module/?id=${state.moduleId}">${esc(m.title)}</a> · <span>Flashcards</span></div>`;
  html += '<div class="done-card">';
  html += '<div class="eyebrow">Deck complete</div>';
  html += `<h2>You finished ${esc(m.title)}.</h2>`;
  html += `<p>${state.cards.length} cards reviewed. The hard ones are the ones to come back to — restart anytime, or move on to the next module.</p>`;
  html += '<div class="btn-row">';
  html += `<button class="btn-restart" id="restartBtn">Restart deck</button>`;
  html += `<a class="btn-secondary" href="/module/?id=${state.moduleId}">Back to ${state.moduleId}</a>`;
  html += `<a class="btn-secondary" href="/dashboard/">Course dashboard</a>`;
  html += '</div></div>';
  root.innerHTML = html;
  document.getElementById('restartBtn').addEventListener('click', () => {
    state.idx = 0; state.flipped = false; state.done = false;
    render();
  });
}

function render(){
  if (state.done){ renderDone(); return; }
  const m = MODULES[state.moduleId];
  const total = state.cards.length;
  const card = state.cards[state.idx];
  const pct = total > 0 ? Math.round(((state.idx) / total) * 100) : 0;

  const root = document.getElementById('content');
  document.querySelector('.app').style.setProperty('--accent', m.accent);
  document.title = `${m.title} Flashcards · MBA Rock`;

  let html = '';
  html += `<div class="crumb"><a href="/dashboard/">Dashboard</a> · <a href="/module/?id=${state.moduleId}">${esc(m.title)}</a> · <span>Flashcards</span></div>`;
  html += '<div class="head-row">';
  html += `<h1>${esc(m.title)} flashcards</h1>`;
  html += `<div class="meta"><b>${state.idx + 1}</b> of ${total}</div>`;
  html += '</div>';
  html += `<div class="progress-bar"><i style="width:${pct}%;"></i></div>`;

  html += '<div class="stage">';
  html += `<div class="card${state.flipped ? ' flipped' : ''}" id="cardEl">`;
  html += '<div class="face front">';
  html += '<div class="lbl">Question</div>';
  html += `<div class="n">${state.idx + 1} / ${total}</div>`;
  html += `<div class="content" data-katex>${esc(card.q)}</div>`;
  html += '<div class="flip-hint">Click or press SPACE to flip</div>';
  html += '</div>';
  html += '<div class="face back">';
  html += '<div class="lbl">Answer</div>';
  html += `<div class="n">${state.idx + 1} / ${total}</div>`;
  html += `<div class="content" data-katex>${esc(card.a)}</div>`;
  html += '<div class="flip-hint">→ Next card</div>';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="controls">';
  html += '<div class="nav">';
  html += `<button id="prevBtn"${state.idx===0?' disabled':''}>← Previous</button>`;
  html += `<button id="shuffleBtn">Shuffle</button>`;
  html += '</div>';
  html += `<button class="flip" id="flipBtn">${state.flipped?'See question':'Flip card'}</button>`;
  html += '<div class="nav">';
  html += `<button id="nextBtn">${state.idx===total-1?'Finish ›':'Next →'}</button>`;
  html += '</div>';
  html += '</div>';

  html += '<div class="kb-hint">Keys: <kbd>←</kbd> previous · <kbd>SPACE</kbd> flip · <kbd>→</kbd> next · <kbd>S</kbd> shuffle</div>';

  root.innerHTML = html;

  // Render KaTeX (auto-detect $...$ and $$...$$ in the cards)
  if (window.renderMathInElement){
    document.querySelectorAll('[data-katex]').forEach(el => {
      try {
        window.renderMathInElement(el, {
          delimiters: [
            {left:'$$', right:'$$', display:true},
            {left:'$', right:'$', display:false}
          ],
          throwOnError: false
        });
      } catch(e){ console.warn('KaTeX render', e); }
    });
  }

  // Wire events
  document.getElementById('cardEl').addEventListener('click', flip);
  document.getElementById('flipBtn').addEventListener('click', flip);
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('shuffleBtn').addEventListener('click', shuffle);
}

function flip(){ state.flipped = !state.flipped; render(); }
function prev(){ if (state.idx > 0){ state.idx--; state.flipped = false; render(); } }
function next(){
  if (state.idx >= state.cards.length - 1){ state.done = true; render(); return; }
  state.idx++; state.flipped = false; render();
}
function shuffle(){
  for (let i = state.cards.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [state.cards[i], state.cards[j]] = [state.cards[j], state.cards[i]];
  }
  state.idx = 0; state.flipped = false; state.done = false;
  render();
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (state.done) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); next(); }
  else if (e.key === ' '){ e.preventDefault(); flip(); }
  else if (e.key === 's' || e.key === 'S'){ shuffle(); }
});

async function init(){
  const params = new URLSearchParams(location.search);
  const mid = (params.get('mod') || params.get('id') || 'M1').toUpperCase();
  if (!MODULES[mid]){
    renderError(mid, `Module ${esc(mid)} not found.`);
    return;
  }
  state.moduleId = mid;
  renderLoading(mid);
  const cards = await loadDeck(mid);
  if (!cards || !cards.length){
    renderError(mid, 'Could not load any cards for this module.');
    return;
  }
  state.cards = cards;
  state.idx = 0;
  state.flipped = false;
  state.done = false;
  render();
}

init();
</script>
