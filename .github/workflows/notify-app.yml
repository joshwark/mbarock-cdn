name: Notify MBA Rock app
on: { push: { branches: [main] } }
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.MBA_ROCK_APP_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/joshwark/mba-rock-app/dispatches \
            -d '{"event_type":"content-updated"}'
