<style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.min.js" integrity="sha384-4Cjkyy4cE1EgIS0C+Y3xzGmJ2noQFRRU91yKAW8IxtPfVtbQXPMqadSc3sYnjwou" crossorigin="anonymous"></script>
<script>
const SB_URL='https://ciloqphtencjthkedanw.supabase.co';
const SB_KEY='sb_publishable_qezI6CBipqlcoj3nXV47PQ__4NpVKS-';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){ try{ if(!u) return '#'; var s=String(u).trim(); if(/^javascript:/i.test(s)||/^data:/i.test(s)||/^vbscript:/i.test(s)) return '#'; if(/^[a-z]+:\/\//i.test(s)) return s; if(s.startsWith('mailto:')||s.startsWith('tel:')||s.startsWith('/')||s.startsWith('#')||s.startsWith('?')) return s; return 'https://'+s; }catch(e){return '#';} }
function md(text){
  if (!text) return '';
  text = escapeHtml(text);
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_,t,u){ return '<a href="'+escapeHtml(safeUrl(u))+'" target="_blank" rel="noopener">'+t+'</a>'; });
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1 style="font-size:32px;margin:12px 0">$1</h1>');
  text = text.replace(/(?:^|\n)((?:- .+(?:\n|$))+)/g, m => '<ul>' + m.trim().split('\n').map(l => '<li>' + l.replace(/^- /,'') + '</li>').join('') + '</ul>');
  return text.split(/\n\n+/).map(p => /^<(h1|h2|h3|ul|ol)/.test(p.trim()) ? p : `<p>${p.replace(/\n/g,'<br>')}</p>`).join('\n');
}

(async () => {
  const { data: posts } = await sb.from('whats_new_posts').select('*').eq('published', true).order('published_at',{ascending:false}).limit(12);
  document.getElementById('loading').style.display='none';
  if (!posts || !posts.length){ document.getElementById('content').innerHTML='<div class="wrap" style="padding:60px 0"><h1>No updates yet</h1><p>Check back soon.</p></div>'; document.getElementById('content').style.display='block'; return; }
  document.getElementById('content').style.display='block';
  const latest = posts[0];
  document.getElementById('postTitle').textContent = latest.title;
  document.getElementById('postMeta').textContent = 'Published ' + new Date(latest.published_at).toLocaleDateString([], {year:'numeric',month:'long',day:'numeric'});
  document.getElementById('postBody').innerHTML = md(latest.body_md);
  const stats = latest.hero_stats || {};
  const statsHtml = Object.entries(stats).map(([k,v]) => `<div class="stat"><div class="n">${v}</div><div class="l">${k.replace(/_/g,' ')}</div></div>`).join('');
  document.getElementById('stats').innerHTML = statsHtml;
  if (posts.length > 1){
    document.getElementById('olderList').innerHTML = posts.slice(1).map(p => `<a class="older-item" href="?p=${escapeHtml(p.slug)}"><div class="date">${new Date(p.published_at).toLocaleDateString()}</div><div class="title">${escapeHtml(p.title)}</div></a>`).join('');
  }
})();
</script>
