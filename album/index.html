*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;background:#FAF8F5;color:#0E1116;font-family:'Inter',-apple-system,sans-serif;line-height:1.6;}
body{padding-bottom:130px;} /* clearance for the fixed player bar */

.alb-noscript ol{margin:0 0 18px;padding-left:22px;font-size:14.5px;}

.alb-vol{background:#fff;border:1px solid #E5E0D6;border-top:4px solid #0B1F3A;border-radius:14px;margin:0 0 18px;overflow:hidden;}
.alb-vol-head{display:grid;grid-template-columns:72px 1fr auto 28px;gap:18px;align-items:center;width:100%;background:transparent;border:0;padding:16px 20px;text-align:left;cursor:pointer;font-family:inherit;}
.alb-vol-head:hover{background:#FAF8F5;}

.alb-vol-no{font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#999;font-weight:700;}
.alb-vol-title{font-family:'Fraunces',serif;font-size:21px;color:#0B1F3A;font-weight:600;line-height:1.2;margin-top:2px;}
.alb-vol-meta{font-family:'Inter',sans-serif;font-size:12px;color:#999;white-space:nowrap;}
.alb-vol-chev{display:inline-flex;align-items:center;justify-content:center;color:#F26B1F;font-size:12px;transition:transform .25s ease;}
.alb-vol-head[aria-expanded="true"] .alb-vol-chev{transform:rotate(180deg);}
.alb-tracks{border-top:1px solid #ebe6da;}
.alb-tracks ol{list-style:none;margin:0;padding:0;}
.alb-tr{padding:0 20px;border-bottom:1px solid #f3efe6;}
.alb-tr:last-child{border-bottom:0;}
.alb-tr[aria-current="true"]{background:#FBF3EC;}
.alb-tr-row{display:grid;grid-template-columns:38px 26px 1fr auto;gap:12px;align-items:center;padding:10px 0;}

.alb-tr-play:hover{border-color:#F26B1F;color:#F26B1F;}
.alb-tr-no{font-family:'Inter',sans-serif;font-size:12px;color:#999;text-align:right;font-variant-numeric:tabular-nums;}
.alb-tr-title{font-family:'Fraunces',serif;font-size:16.5px;color:#0B1F3A;font-weight:500;line-height:1.3;min-width:0;}

.mr5-lyrics-btn .mr5-chev{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;transition:transform .25s ease;color:#F26B1F;font-size:10px;}
.mr5-lyrics-btn[aria-expanded="true"] .mr5-chev{transform:rotate(180deg);}

.ab-ctrls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ab-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;cursor:pointer;font-size:14px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit;}

.ab-pill{width:auto;min-width:44px;padding:0 12px;font-size:12px;font-weight:700;}

.ab-seek{display:flex;align-items:center;gap:10px;flex:1;min-width:120px;}
.ab-time{font-size:11px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;min-width:38px;text-align:center;}
.ab-seek input[type=range]{flex:1;accent-color:#F26B1F;height:4px;cursor:pointer;}

  .ab-seek{flex:1 1 100%;order:5;min-width:0;}
  body{padding-bottom:150px;}

<script>
/* MR_ALBUM_CORE_START — DOM-free player core (queue, shuffle, rate, resume, telemetry, media-session payloads).
   Tested by the BR-20260610-37 node simulation against the exact bytes shipped here. */
(function () {
  'use strict';
  function mrCreateAlbumCore(data, hooks) {
    var vols = (data && data.volumes) || [];
    function identity(v) { return v.tracks.map(function (_, i) { return i; }); }
    var orders = vols.map(identity);     // per-volume play order (permuted when shuffle is on)
    var shuffle = false;
    var RATES = [1, 1.25, 1.5];
    var rateIdx = 0;
    var cur = null;                      // { vi, ti }
    var played = {};                     // 'vi:ti' -> 1 — one album_play per track per page load
    function rng() { return (hooks.random || Math.random)(); }
    function reshuffle(vi) {
      var ord = identity(vols[vi]);
      for (var i = ord.length - 1; i > 0; i--) {
        var j = Math.floor(rng() * (i + 1));
        var t = ord[i]; ord[i] = ord[j]; ord[j] = t;
      }
      orders[vi] = ord;
    }
    function track(vi, ti) { return vols[vi].tracks[ti]; }
    function meta(vi, ti) {
      var v = vols[vi], t = track(vi, ti);
      return {
        title: t.title,
        artist: (data && data.artist) || 'MBA Rock',
        album: 'MBA Rock, Vol. ' + v.vol + ' — ' + v.title,
        artwork: [{ src: v.cover, sizes: '640x640', type: 'image/jpeg' }]
      };
    }
    function persist(pos) {
      try {
        hooks.save(JSON.stringify({
          vi: cur ? cur.vi : 0, ti: cur ? cur.ti : 0,
          pos: pos || 0, rate: RATES[rateIdx], shuffle: shuffle
        }));
      } catch (e) {}
    }
    function start(vi, ti, pos, autoplay) {
      cur = { vi: vi, ti: ti };
      hooks.setTrack(track(vi, ti), vols[vi], vi, ti, pos || 0, !!autoplay);
      hooks.setMetadata(meta(vi, ti));
      persist(pos || 0);
      return true;
    }
    function step(dir) {
      if (!cur) return start(0, orders[0][0], 0, true);
      var ord = orders[cur.vi];
      var p = ord.indexOf(cur.ti) + dir;
      if (p >= 0 && p < ord.length) return start(cur.vi, ord[p], 0, true);
      var nvi = cur.vi + dir;
      if (nvi < 0 || nvi >= vols.length) return false;          // album edge — stop, no wrap
      var nord = orders[nvi];
      return start(nvi, dir > 0 ? nord[0] : nord[nord.length - 1], 0, true);
    }
    return {
      current: function () { return cur ? { vi: cur.vi, ti: cur.ti, track: track(cur.vi, cur.ti), vol: vols[cur.vi] } : null; },
      order: function (vi) { return orders[vi].slice(); },
      rate: function () { return RATES[rateIdx]; },
      shuffled: function () { return shuffle; },
      select: function (vi, ti, pos, autoplay) { return start(vi, ti, pos || 0, autoplay !== false); },
      next: function () { return step(1); },
      prev: function () { return step(-1); },
      cycleRate: function () {
        rateIdx = (rateIdx + 1) % RATES.length;
        hooks.setRate(RATES[rateIdx]);
        persist(hooks.position ? hooks.position() : 0);
        return RATES[rateIdx];
      },
      toggleShuffle: function () {
        shuffle = !shuffle;
        if (shuffle) { vols.forEach(function (_, vi) { reshuffle(vi); }); }
        else { orders = vols.map(identity); }
        persist(hooks.position ? hooks.position() : 0);
        return shuffle;
      },
      notifyPlaying: function () {                               // emit album_play ONCE per track per page load
        if (!cur) return;
        var k = cur.vi + ':' + cur.ti;
        if (played[k]) return;
        played[k] = 1;
        hooks.emit('album_play', { track: track(cur.vi, cur.ti).title, vol: vols[cur.vi].vol });
      },
      notifyEnded: function () {                                 // emit completion, then auto-advance
        if (cur) hooks.emit('album_track_complete', { track: track(cur.vi, cur.ti).title, vol: vols[cur.vi].vol });
        return step(1);
      },
      savePosition: persist,
      resume: function (rawState) {                              // never autoplays
        var s = null;
        try { s = JSON.parse(rawState || 'null'); } catch (e) {}
        if (!s || typeof s.vi !== 'number' || typeof s.ti !== 'number') return false;
        if (!vols[s.vi] || !vols[s.vi].tracks[s.ti]) return false;
        if (s.shuffle) { shuffle = true; vols.forEach(function (_, vi) { reshuffle(vi); }); }
        var ri = RATES.indexOf(s.rate);
        if (ri > -1) { rateIdx = ri; hooks.setRate(RATES[ri]); }
        return start(s.vi, s.ti, s.pos || 0, false);
      }
    };
  }
  if (typeof window !== 'undefined') window.mrCreateAlbumCore = mrCreateAlbumCore;
})();
/* MR_ALBUM_CORE_END */
</script>

<script>
/* BR-20260610-37 — DOM wiring: renders volumes/tracks from /album/album.json and drives the core. */
(function () {
  'use strict';
  var KEY = 'mr-album-state-v1';
  function $(s) { return document.querySelector(s); }
  var statusEl = $('#alb-status'), volsEl = $('#alb-vols'), bar = $('#alb-bar');
  var artEl = $('#ab-art'), titleEl = $('#ab-title'), volEl = $('#ab-vol');
  var playBtn = $('#ab-play'), prevBtn = $('#ab-prev'), nextBtn = $('#ab-next');
  var range = $('#ab-range'), curEl = $('#ab-cur'), durEl = $('#ab-dur');
  var rateBtn = $('#ab-rate'), shufBtn = $('#ab-shuf');

  var audio = new Audio();
  audio.preload = 'none';
  var core = null;
  var curRate = 1;
  var pendingSeek = 0;
  var seeking = false;
  var lastSave = 0;
  var rows = [], volBodies = [], volHeads = [];
  var activeLi = null;

  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  // Telemetry — the EXISTING track.js pipeline only (window.MBATrack.track). No new pipeline.
  function emit(name, props) { try { if (window.MBATrack && window.MBATrack.track) window.MBATrack.track(name, props); } catch (e) {} }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function syncPlayUI(playing) {
    playBtn.textContent = playing ? '❚❚' : '▶';
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; } catch (e) {}
  }
  function posState() {
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
    try {
      if (audio.duration && isFinite(audio.duration)) {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate || 1,
          position: Math.min(audio.currentTime || 0, audio.duration)
        });
      }
    } catch (e) {}
  }
  function setActiveRow(vi, ti) {
    if (activeLi) activeLi.removeAttribute('aria-current');
    activeLi = rows[vi] && rows[vi][ti];
    if (activeLi) activeLi.setAttribute('aria-current', 'true');
    var body = volBodies[vi];
    if (body && body.hidden) { body.hidden = false; volHeads[vi].setAttribute('aria-expanded', 'true'); }
  }

  var coreHooks = {
    setTrack: function (t, v, vi, ti, pos, autoplay) {
      audio.src = t.audio_url;
      pendingSeek = pos || 0;
      audio.playbackRate = curRate;
      titleEl.textContent = t.title;
      volEl.textContent = 'Vol. ' + v.vol + ' — ' + v.title;
      artEl.src = v.cover;
      artEl.alt = '';
      durEl.textContent = fmt(t.duration_s);
      range.max = Math.max(1, Math.floor(t.duration_s || 1));
      range.value = Math.floor(pos || 0);
      curEl.textContent = fmt(pos || 0);
      bar.hidden = false;
      setActiveRow(vi, ti);
      if (autoplay) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
      else { syncPlayUI(false); }
    },
    setMetadata: function (m) {
      if (!('mediaSession' in navigator)) return;
      try { navigator.mediaSession.metadata = new MediaMetadata(m); } catch (e) {}
    },
    setRate: function (r) {
      curRate = r;
      audio.playbackRate = r;
      rateBtn.textContent = (r === 1 ? '1' : String(r)) + '×';
    },
    emit: emit,
    save: function (s) { try { localStorage.setItem(KEY, s); } catch (e) {} },
    position: function () { return audio.currentTime || 0; }
  };

  // ── audio element events ──
  audio.addEventListener('loadedmetadata', function () {
    if (audio.duration && isFinite(audio.duration)) {
      durEl.textContent = fmt(audio.duration);
      range.max = Math.max(1, Math.floor(audio.duration));
    }
    if (pendingSeek > 0 && (!audio.duration || pendingSeek < audio.duration)) {
      try { audio.currentTime = pendingSeek; } catch (e) {}
    }
    pendingSeek = 0;
    audio.playbackRate = curRate;
  });
  audio.addEventListener('play', function () { audio.playbackRate = curRate; });
  audio.addEventListener('playing', function () { syncPlayUI(true); if (core) core.notifyPlaying(); });
  audio.addEventListener('pause', function () { syncPlayUI(false); });
  audio.addEventListener('timeupdate', function () {
    if (!seeking) { range.value = Math.floor(audio.currentTime || 0); curEl.textContent = fmt(audio.currentTime); }
    posState();
    var now = Date.now();
    if (core && now - lastSave > 5000) { lastSave = now; core.savePosition(audio.currentTime || 0); }
  });
  audio.addEventListener('ended', function () {
    if (!core) return;
    var more = core.notifyEnded();
    if (more === false) { syncPlayUI(false); core.savePosition(0); }
  });
  audio.addEventListener('error', function () { try { console.warn('album: audio error', audio.error); } catch (e) {} });

  // ── bar controls ──
  playBtn.addEventListener('click', function () {
    if (!core) return;
    if (!core.current()) { core.select(0, 0, 0, true); return; }
    if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
    else { audio.pause(); }
  });
  prevBtn.addEventListener('click', function () { if (core) core.prev(); });
  nextBtn.addEventListener('click', function () { if (core) core.next(); });
  range.addEventListener('input', function () { seeking = true; curEl.textContent = fmt(parseFloat(range.value)); });
  range.addEventListener('change', function () {
    seeking = false;
    try { audio.currentTime = parseFloat(range.value) || 0; } catch (e) {}
  });
  rateBtn.addEventListener('click', function () { if (core) core.cycleRate(); });
  shufBtn.addEventListener('click', function () {
    if (!core) return;
    var on = core.toggleShuffle();
    shufBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });

  // ── keyboard: space = play/pause, arrows = seek ±10s (never when focus is in a field) ──
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t.tagName) || t.isContentEditable)) return;
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); playBtn.click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); try { audio.currentTime = Math.max(0, (audio.currentTime || 0) - 10); } catch (err) {} }
    else if (e.key === 'ArrowRight') { e.preventDefault(); try { audio.currentTime = Math.min(audio.duration || 0, (audio.currentTime || 0) + 10); } catch (err) {} }
  });

  // ── lock-screen / hardware media keys ──
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); } });
      navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
      navigator.mediaSession.setActionHandler('previoustrack', function () { if (core) core.prev(); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { if (core) core.next(); });
      navigator.mediaSession.setActionHandler('seekto', function (d) {
        try { if (d.fastSeek && audio.fastSeek) audio.fastSeek(d.seekTime); else audio.currentTime = d.seekTime; } catch (e) {}
        posState();
      });
    } catch (e) {}
  }

  window.addEventListener('pagehide', function () { if (core) core.savePosition(audio.currentTime || 0); });

  // ── render (createElement + textContent only — never innerHTML with data) ──
  function buildTrack(v, vi, t, ti) {
    var li = el('li', 'alb-tr');
    var row = el('div', 'alb-tr-row');
    var btn = el('button', 'alb-tr-play', '▶');
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Play ' + t.title);
    btn.addEventListener('click', function () {
      if (!core) return;
      var c = core.current();
      if (c && c.vi === vi && c.ti === ti) { playBtn.click(); return; }   // same track = toggle
      core.select(vi, ti, 0, true);
    });
    var no = el('span', 'alb-tr-no', String(t.track));
    var mid = el('span', 'alb-tr-title', t.title);
    (t.lessons || []).forEach(function (id) {
      var a = el('a', 'alb-chip', 'Lesson ' + id + ' →');
      a.href = '/lesson/?id=' + encodeURIComponent(id);
      mid.appendChild(a);
    });
    var dur = el('span', 'alb-tr-dur', fmt(t.duration_s));
    row.appendChild(btn); row.appendChild(no); row.appendChild(mid); row.appendChild(dur);
    li.appendChild(row);
    if (t.lyrics) {
      var wrap = el('div', 'mr5-lyrics');
      var lb = el('button', 'mr5-lyrics-btn');
      lb.type = 'button';
      lb.setAttribute('aria-expanded', 'false');
      var chev = el('span', 'mr5-chev', '▼');
      chev.setAttribute('aria-hidden', 'true');
      lb.appendChild(chev);
      lb.appendChild(document.createTextNode('Lyrics'));
      var panel = el('div', 'mr5-lyrics-panel');
      var pid = 'alb-lyr-' + vi + '-' + ti;
      panel.id = pid;
      lb.setAttribute('aria-controls', pid);
      panel.appendChild(el('div', 'mr5-lyrics-body', t.lyrics));
      lb.addEventListener('click', function () {
        var open = panel.classList.toggle('open');
        lb.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      wrap.appendChild(lb); wrap.appendChild(panel);
      li.appendChild(wrap);
    }
    rows[vi][ti] = li;
    return li;
  }

  function buildVolume(v, vi) {
    var card = el('section', 'alb-vol');
    card.style.borderTopColor = v.color || '#0B1F3A';
    var head = el('button', 'alb-vol-head');
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    var img = el('img');
    img.src = v.cover; img.alt = ''; img.loading = 'lazy'; img.width = 72; img.height = 72;
    var mid = el('div');
    var no = el('div', 'alb-vol-no', 'Vol. ' + v.vol + ' · ' + v.module_id);
    if (v.color) no.style.color = v.color;
    mid.appendChild(no);
    mid.appendChild(el('div', 'alb-vol-title', v.title));
    var total = 0;
    v.tracks.forEach(function (t) { total += t.duration_s || 0; });
    var meta = el('div', 'alb-vol-meta', v.tracks.length + ' tracks · ' + fmt(total));
    var chev = el('span', 'alb-vol-chev', '▾');
    chev.setAttribute('aria-hidden', 'true');
    head.appendChild(img); head.appendChild(mid); head.appendChild(meta); head.appendChild(chev);
    var body = el('div', 'alb-tracks');
    body.hidden = true;
    body.id = 'alb-vol-body-' + vi;
    head.setAttribute('aria-controls', body.id);
    var list = el('ol');
    rows[vi] = [];
    v.tracks.forEach(function (t, ti) { list.appendChild(buildTrack(v, vi, t, ti)); });
    body.appendChild(list);
    head.addEventListener('click', function () {
      var open = body.hidden;
      body.hidden = !open;
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    card.appendChild(head); card.appendChild(body);
    volHeads[vi] = head; volBodies[vi] = body;
    return card;
  }

  fetch('/album/album.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var frag = document.createDocumentFragment();
      (data.volumes || []).forEach(function (v, vi) { frag.appendChild(buildVolume(v, vi)); });
      volsEl.appendChild(frag);
      if (statusEl && statusEl.parentNode) statusEl.parentNode.removeChild(statusEl);
      core = window.mrCreateAlbumCore(data, coreHooks);
      var resumed = false;
      try { resumed = core.resume(localStorage.getItem(KEY)); } catch (e) {}
      if (resumed) { shufBtn.setAttribute('aria-pressed', core.shuffled() ? 'true' : 'false'); }
      else { core.select(0, 0, 0, false); }                      // bar ready on track 1, paused
    })
    .catch(function (e) {
      if (statusEl) statusEl.textContent = 'The album failed to load — refresh to try again.';
      try { console.warn('album load failed', e); } catch (e2) {}
    });
})();
</script>
