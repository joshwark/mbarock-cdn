<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* MBA Rock - Member gate v1 2026-05-14 */
(function(){
  try {
    var hasAuth = localStorage.getItem('mr-member-id') || localStorage.getItem('mr_member_id') || localStorage.getItem('memberId') || new URLSearchParams(location.search).get('m') || (document.referrer && /mbarock\.com|panda-reindeer/i.test(document.referrer));
    if (hasAuth) return;
    var css = '.mr-gate{position:fixed;inset:0;z-index:2147483647;background:linear-gradient(180deg,#0B1F3A 0%,#152D52 100%);color:#FDFAF1;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;padding:40px;text-align:center}.mr-gate-inner{max-width:580px}.mr-gate .pill{display:inline-block;background:rgba(242,107,31,.18);color:#F26B1F;padding:8px 16px;border-radius:999px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:24px;border:1px solid rgba(242,107,31,.35)}.mr-gate h1{font-family:Fraunces,Georgia,serif;font-size:clamp(32px,5vw,52px);color:#FDFAF1;margin:0 0 20px;line-height:1.12;font-weight:800;letter-spacing:-.02em}.mr-gate p{font-size:18px;line-height:1.6;color:rgba(253,250,241,.86);margin:0 0 32px}.mr-gate .price-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}.mr-gate .price-row .anchor{font-family:Fraunces;color:rgba(253,250,241,.5);text-decoration:line-through;font-size:18px;font-style:italic}.mr-gate .price-row .now{font-family:Fraunces;font-size:42px;font-weight:800;color:#FDFAF1;line-height:1;letter-spacing:-.02em}.mr-gate .price-row .code{font-family:Inter;font-size:12px;font-weight:700;letter-spacing:.16em;color:#F26B1F;text-transform:uppercase}.mr-gate .cta{display:inline-block;padding:18px 44px;background:#F26B1F;color:#fff;border-radius:999px;font-weight:700;font-size:16px;letter-spacing:.04em;text-decoration:none;min-height:48px;line-height:1.2;box-shadow:0 12px 28px rgba(242,107,31,.32)}.mr-gate .ghost{display:inline-block;padding:16px 32px;color:#FDFAF1;border:2px solid rgba(253,250,241,.4);border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;margin-top:12px;margin-left:8px}';
    var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
    function build(){
      var g = document.createElement('div');
      g.className = 'mr-gate';
      g.setAttribute('role','dialog');
      g.setAttribute('aria-modal','true');
      var html = '';
      html += '<div class="mr-gate-inner">';
      html += '<span class="pill">Members only - MBA Rock</span>';
      html += '<h1>Course Search is part of MBA Rock.</h1>';
      html += '<p>Search every lesson, calculator, and glossary entry across the 10 modules. Join MBA Rock to unlock search.</p>';
      html += '<div class="price-row"><span class="anchor">$999.99</span><span class="now">$499</span><span class="code">with code FOUNDERS</span></div>';
      html += '<a href="https://www.mbarock.com/mba-rock" class="cta">Unlock MBA Rock \u2192</a>';
      html += '<a href="https://www.mbarock.com" class="ghost">See what\u2019s inside</a>';
      html += '</div>';
      g.innerHTML = html;
      document.body.appendChild(g);
      document.body.style.overflow = 'hidden';
    }
    if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
  } catch(e) { console.error('[MR gate] error', e); }
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Search · MBA Rock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,system-ui;background:#FAF8F5;color:#0B1F3A;padding:0;}
  .wrap{max-width:980px;margin:0 auto;padding:48px 24px;}
  h1{font-family:Fraunces,serif;font-size:42px;font-weight:600;margin-bottom:8px;}
  .sub{color:#475569;font-size:15px;margin-bottom:32px;}
  .search-box{position:relative;margin-bottom:24px;}
  .search-input{width:100%;padding:18px 22px 18px 56px;font-size:17px;font-family:Inter,sans-serif;border:2px solid #E5E0D6;border-radius:12px;background:#fff;outline:none;color:#0B1F3A;}
  .search-input:focus{border-color:#F26B1F;}
  .search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:20px;color:#94A3B8;}
  .meta{font-size:13px;color:#94A3B8;margin-bottom:20px;}
  .results{display:flex;flex-direction:column;gap:14px;}
  .result{padding:18px 22px;background:#fff;border:1px solid #E5E0D6;border-radius:12px;text-decoration:none;color:inherit;display:block;transition:border-color .15s;}
  .result:hover{border-color:#F26B1F;}
  .result-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94A3B8;font-weight:600;margin-bottom:4px;}
  .result-title{font-family:Fraunces,serif;font-size:21px;font-weight:600;margin-bottom:6px;}
  .result-snip{font-size:14px;color:#475569;line-height:1.5;}
  .result-snip mark{background:#FEF3C7;padding:1px 3px;border-radius:3px;}
  .empty{padding:40px;text-align:center;color:#94A3B8;font-style:italic;}
  .back{display:inline-block;color:#F26B1F;text-decoration:none;font-size:14px;margin-bottom:24px;}
  .back:hover{text-decoration:underline;}
</style>
</head>
<body>
<div hidden id="mr-protected">

<div class="wrap">
  <a href="/dashboard/" class="back">← Back to dashboard</a>
  <h1>Search the curriculum</h1>
  <p class="sub">Find any concept, framework, formula, or lesson across all 74 lessons.</p>
  <div class="search-box">
    <span class="search-icon">⌕</span>
    <input type="text" class="search-input" id="searchInput" placeholder="Try: 'CAC', 'cash conversion', 'pricing strategy'..." autofocus>
  </div>
  <div class="meta" id="resultMeta">Loading lessons…</div>
  <div class="results" id="results"></div>
</div>
<script>
(function(){
  var lessons = [];
  var modName = {M1:"Finance Fundamentals",M2:"Strategy & Competitive Advantage",M3:"People & Leadership",M4:"Unit Economics & Growth Metrics",M5:"Operations & Technology",M6:"Growth & Capital",M7:"Marketing & Brand",M8:"Operations & Execution",M9:"Analytics & Decision Making",M10:"Innovation & Future (Capstone)"};
  
  fetch('https://raw.githubusercontent.com/joshwark/mbarock-cdn/main/lessons.v2.json?cb=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      lessons = d.lessons || [];
      document.getElementById('resultMeta').textContent = 'Loaded ' + lessons.length + ' lessons. Type to search.';
      render('');
    })
    .catch(function(e){
      document.getElementById('resultMeta').textContent = 'Failed to load lessons. Refresh to retry.';
    });
  
  function highlight(text, q) {
    if (!q || !text) return (text||'').slice(0,200);
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    return text.replace(re, '<mark>$1</mark>').slice(0,300);
  }
  
  function getSearchText(l) {
    var concepts = (l.core_concepts || []).map(function(c){ 
      return (c.title || '') + ' ' + (c.body || ''); 
    }).join(' ');
    var ta = (l.take_action || []).join(' ');
    return [l.id, l.title, l.intro, concepts, ta, l.deep_dive].filter(Boolean).join(' ');
  }
  
  function render(q) {
    var resultsEl = document.getElementById('results');
    var metaEl = document.getElementById('resultMeta');
    if (!q) {
      // Show all lessons grouped (just titles)
      resultsEl.innerHTML = lessons.map(function(l){
        return '<a class="result" href="https://panda-reindeer-4akp.squarespace.com/mba-rock/' 
          + (l.slug_v2 || l.legacy_slug || l.id.toLowerCase()) + '">'
          + '<div class="result-eyebrow">' + (modName[l.module_id] || l.module_id) + ' · ' + l.id + '</div>'
          + '<div class="result-title">' + l.title + '</div>'
          + '<div class="result-snip">' + (l.intro || '').slice(0,180) + '</div>'
          + '</a>';
      }).join('');
      metaEl.textContent = 'All 74 lessons (type to filter).';
      return;
    }
    
    var qLower = q.toLowerCase();
    var matched = lessons.map(function(l){
      var hay = getSearchText(l).toLowerCase();
      var idx = hay.indexOf(qLower);
      if (idx < 0) return null;
      // Score: title match > intro match > body match
      var score = 0;
      if ((l.title || '').toLowerCase().includes(qLower)) score += 100;
      if ((l.intro || '').toLowerCase().includes(qLower)) score += 50;
      score += Math.max(0, 30 - idx/100);
      return { lesson: l, score: score, matchIdx: idx };
    }).filter(Boolean).sort(function(a,b){ return b.score - a.score; });
    
    metaEl.textContent = matched.length + ' result' + (matched.length === 1 ? '' : 's') + ' for "' + q + '"';
    
    if (!matched.length) {
      resultsEl.innerHTML = '<div class="empty">No lessons match "' + q + '" — try a different phrase.</div>';
      return;
    }
    
    resultsEl.innerHTML = matched.slice(0,30).map(function(m){
      var l = m.lesson;
      var snip = getSearchText(l);
      var start = Math.max(0, snip.toLowerCase().indexOf(qLower) - 60);
      var excerpt = (start > 0 ? '… ' : '') + snip.slice(start, start + 240);
      return '<a class="result" href="https://panda-reindeer-4akp.squarespace.com/mba-rock/' 
        + (l.slug_v2 || l.legacy_slug || l.id.toLowerCase()) + '">'
        + '<div class="result-eyebrow">' + (modName[l.module_id] || l.module_id) + ' · ' + l.id + '</div>'
        + '<div class="result-title">' + highlight(l.title, q) + '</div>'
        + '<div class="result-snip">' + highlight(excerpt, q) + '</div>'
        + '</a>';
    }).join('');
  }
  
  var input = document.getElementById('searchInput');
  var debounce;
  input.addEventListener('input', function(e){
    clearTimeout(debounce);
    debounce = setTimeout(function(){ render(e.target.value.trim()); }, 120);
  });
})();
</script>

</div>

<script>
/* MR auth-gated render v2 — strips member content from DOM for unauth visitors */
(function(){
  try {
    var hasAuth = !!(
      localStorage.getItem('mba-rock-member-id') ||
      localStorage.getItem('mr-member-id') ||
      localStorage.getItem('mr_member_id') ||
      localStorage.getItem('memberId') ||
      new URLSearchParams(location.search).get('m') ||
      (document.referrer && /mbarock\.com|panda-reindeer/i.test(document.referrer))
    );
    var m = document.getElementById('mr-protected');
    if (hasAuth) {
      if (m) m.hidden = false;
    } else {
      if (m && m.parentNode) m.parentNode.removeChild(m);
    }
  } catch (e) { console.error('[MR auth-render]', e); }
})();
</script>
</body>
</html>
